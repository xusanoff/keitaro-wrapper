<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Keitaro Wrapper{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a23'/%3E%3Cpath d='M8 10h7l3 6-3 6H8m10-6h6' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">KT</span>Keitaro Wrapper</a>
      <nav class="nav" aria-label="Main">
        <a href="/" {% if page == 'new' %}aria-current="page"{% endif %}>New campaign</a>
        <a href="/campaigns" {% if page == 'edit' %}aria-current="page"{% endif %}>Edit campaign</a>
      </nav>
      <span class="env mono">Admin API v1</span>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', path='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
