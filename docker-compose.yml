services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wrapper
      POSTGRES_PASSWORD: wrapper
      POSTGRES_DB: wrapper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapper -d wrapper"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://wrapper:wrapper@db:5432/wrapper
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
